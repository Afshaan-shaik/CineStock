<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1526" />
      <stop offset="50%" stop-color="#090a10" />
      <stop offset="100%" stop-color="#191c2e" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#35d0ba" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- CRT Scanlines Background -->
  <g opacity="0.12">
    <line x1="0" y1="40" x2="400" y2="40" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="80" x2="400" y2="80" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="120" x2="400" y2="120" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="160" x2="400" y2="160" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="200" x2="400" y2="200" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="240" x2="400" y2="240" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="280" x2="400" y2="280" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="320" x2="400" y2="320" stroke="#78dcff" stroke-width="1" />
    <line x1="0" y1="360" x2="400" y2="360" stroke="#78dcff" stroke-width="1" />
  </g>

  <!-- Glowing Outer Frame Rings -->
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#glowRing)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="200" cy="200" r="150" fill="#0b0f19" stroke="#253047" stroke-width="3" />

  <!-- Silhouette & Aesthetic Elements -->
  <circle cx="200" cy="148" r="48" fill="#1b2438" stroke="#3b4b6e" stroke-width="2" />
  <path d="M125 285 C125 225, 155 208, 200 208 C245 208, 275 225, 275 285 Z" fill="#161e30" stroke="#2a3754" stroke-width="2" />

  <!-- Glowing Monogram "AS" -->
  <text x="200" y="222" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="52" font-weight="700" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">AS</text>

  <!-- Retro VHS HUD Tags -->
  <text x="200" y="325" font-family="'Space Mono', monospace" font-size="12" font-weight="700" fill="#f5a623" text-anchor="middle" letter-spacing="3">AFSHAN SHEIKH</text>
  <text x="200" y="345" font-family="'Space Mono', monospace" font-size="10" fill="#78dcff" text-anchor="middle" letter-spacing="2">CREATOR &amp; DEV</text>
</svg>
